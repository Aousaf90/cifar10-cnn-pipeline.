stages:
  prepare:
    cmd: python src/prepare.py
    deps: [src/prepare.py, src/data_io.py]
    outs: [data/raw]
  preprocess:
    cmd: python src/preprocess.py
    deps: [src/preprocess.py, src/data_io.py, data/raw]
    params: [preprocess.val_size, preprocess.seed, preprocess.image_size]
    outs: [data/processed]
  train:
    cmd: python src/train.py
    deps: [src/train.py, src/models.py, src/data_io.py, data/processed]
    params: [train]
    outs: [models]
  evaluate:
    cmd: python src/evaluate.py
    deps: [src/evaluate.py, src/models.py, src/data_io.py, models/model.pth, data/processed]
    params: [train.num_filters, train.dropout_rate]
    outs: [confusion_matrix.png]
    metrics:
      - metrics.json:
          cache: false